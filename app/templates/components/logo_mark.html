  </defs>
  <g stroke="url(#logoGoldGrad)" stroke-width="1.3" opacity="0.85">
    <line x1="22" y1="8" x2="10" y2="18"/>

    <line x1="22" y1="8" x2="22" y2="22"/>

  <circle cx="10" cy="18" r="2.6" fill="url(#logoGoldGrad)"/>
  <circle cx="34" cy="18" r="2.6" fill="url(#logoGoldGrad)"/>
  <circle cx="22" cy="22" r="3" fill="#201C14"/>
  <circle cx="22" cy="22" r="3" fill="url(#logoGoldGrad)" opacity="0.55"/>
  <circle cx="14" cy="33" r="2.6" fill="url(#logoGoldGrad)"/>
  <circle cx="30" cy="33" r="2.6" fill="url(#logoGoldGrad)"/>
