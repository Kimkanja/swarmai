{% extends "base.html" %}
{% block title %}Page Not Found — {{ SITE_NAME }}{% endblock %}
{% block content %}
<section class="center" style="padding:100px 0;">
  <div class="narrow">
    <div class="error-code">404</div>
    <h1>Page not found</h1>
    <p class="lead" style="margin:0 auto 24px;">The page you're looking for doesn't exist or has moved.</p>
    <a class="btn btn-gold" href="{{ url_for('main.home') }}">Back to home</a>
  </div>
</section>
{% endblock %}
